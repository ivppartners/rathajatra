# Production-grade Secure and Efficient Nginx Configuration for Rathajatra Astro App
# Place this file in your /etc/nginx/sites-available/ or include it in your nginx.conf

# Define rate limiting zone for the contact form API to prevent abuse (5 requests per minute)
limit_req_zone $binary_remote_addr zone=contact_api_limit:10m rate=5r/m;

upstream astro_node_backend {
    server 127.0.0.1:4321; # Default Astro SSR standalone port
    keepalive 32;          # Keep alive connections to Node.js backend
}

# Redirect all HTTP requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rathajatra.lt www.rathajatra.lt; # Replace with your actual domain

    location /.well-known/acme-challenge/ {
        root /var/www/html; # For Let's Encrypt certificates validation
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rathajatra.lt www.rathajatra.lt; # Replace with your actual domain

    # Static assets path (replace with actual absolute path to built dist/client directory)
    root /Users/satakula/Repos/rathajatra/dist/client;
    index index.html;

    # SSL / TLS Hardening (Mozilla Intermediate Configuration)
    ssl_certificate /etc/letsencrypt/live/rathajatra.lt/fullchain.pem; # Replace path
    ssl_certificate_key /etc/letsencrypt/live/rathajatra.lt/privkey.pem; # Replace path
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # SSL Session cache optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security) - Enable only after testing TLS connection
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Premium Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://www.hey.lt https://paysera.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Buffer size & Timeout limits to prevent Slowloris / Buffer Overflow attacks
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 10M; # Max payload size
    large_client_header_buffers 4 8k;
    
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Logging config
    access_log /var/log/nginx/rathajatra.access.log;
    error_log /var/log/nginx/rathajatra.error.log warn;

    # 1. High Performance: Serve static assets directly with long-term caching
    # Files inside _astro (hashed JS, CSS, images) can be cached forever
    location /_astro/ {
        alias /Users/satakula/Repos/rathajatra/dist/client/_astro/;
        expires max;
        access_log off;
        add_header Cache-Control "public, no-transform";
        
        # Re-add security headers for static files (as Nginx add_header is not inherited)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Common public assets (images, favicon, robots.txt, etc.)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        
        # Re-add security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2. Hardened API Security: Apply rate limiting to email form endpoint
    location = /api/send-email {
        limit_req zone=contact_api_limit burst=3 nodelay;
        
        proxy_pass http://astro_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep read/write timeouts short for dynamic endpoints
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # 3. Handle both Prerendered Static Pages and SSR routing
    # Serve static pre-rendered HTML files directly, fallback to dynamic Node server
    location / {
        # Check for static HTML page matching the URI or fallback to Astro backend
        try_files $uri $uri/index.html $uri.html @astro_node;
    }

    # Fallback block that proxies requests to the running Astro SSR server
    location @astro_node {
        proxy_pass http://astro_node_backend;
        proxy_http_version 1.1;
        
        # Enable HTTP keep-alive
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts to prevent hanging server connections
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Deny access to hidden/sensitive files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
